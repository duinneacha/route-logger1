<!DOCTYPE html>
<html lang="en-IE">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F4F7F5">
    <title>Route notes</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/app.css">
  </head>
  <body>
    <header class="top">
      <div class="heading">
        <h1 id="title">Route notes</h1>
        <p id="status" aria-live="polite">No round yet</p>
      </div>
      <div class="top-actions">
        <button type="button" class="quiet" id="home" hidden>Home</button>
        <button type="button" class="quiet" id="back" hidden>Back</button>
        <button type="button" class="quiet" id="end-round" hidden>End round</button>
      </div>
    </header>

    <main id="main"></main>

    <div class="dock" id="dock">
      <p class="consent" id="consent">Ask the person with you before you use the microphone.</p>
      <p class="live" id="live" hidden></p>
      <div class="pair" id="pair">
        <button type="button" id="type-btn">Type</button>
        <button type="button" id="camera-btn">Camera</button>
      </div>
      <button type="button" class="speak" id="speak-btn" aria-pressed="false">Speak</button>
      <button type="button" class="speak" id="start-btn" hidden>Start round</button>
      <button type="button" class="speak" id="send-btn" hidden>Send</button>
    </div>

    <form class="composer" id="composer" hidden>
      <label for="draft">Note</label>
      <textarea id="draft" rows="5" enterkeyhint="done"></textarea>
      <div class="pair">
        <button type="button" id="draft-cancel">Cancel</button>
        <button type="submit" id="draft-save">Save note</button>
      </div>
    </form>

    <input id="camera" type="file" accept="image/*" capture="environment" hidden>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
